short_bio: >-
  <p>
    I am a senior B.S. student majoring in Artificial Intelligence at <strong>Dalian University of Technology</strong>, and an <strong>incoming Direct-PhD student (starting Fall 2027)</strong> at the School of Data Science, <strong>Fudan University</strong>, where I will be advised by <a href="http://www.fudan-disc.com/people/zywei" target="_blank">Prof. Zhongyu Wei (魏忠钰)</a> in the <a href="http://www.fudan-disc.com/" target="_blank">Data Intelligence and Social Computing Lab (Fudan DISC)</a>.
  </p>
  <p>
    During my undergraduate studies, I have been working as a research intern at the <strong>DUT Information Retrieval Lab (DUTIR)</strong> under the supervision of <a href="https://faculty.dlut.edu.cn/yangliang1986/zh_CN/index.htm" target="_blank">Assoc. Prof. Liang Yang</a> and <a href="https://ir.dlut.edu.cn/info/1031/1092.htm" target="_blank">Prof. Hongfei Lin</a>.
  </p>
  <p>
    I always welcome academic discussions and potential collaborations—please feel free to reach out at <a href="mailto:huluoming2004@163.com">huluoming2004@163.com</a> or my institutional email <a href="mailto:huluoming2004@mail.dlut.edu.cn">huluoming2004@mail.dlut.edu.cn</a>.
  </p>

