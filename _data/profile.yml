short_bio_text_justify: false
short_bio: >-
  <p>
    I am a senior B.S. student majoring in Artificial Intelligence (Innovation Class) at <strong>Dalian University of Technology (DUT)</strong> (GPA: 93.01 / 100, Rank: 1 / 58), and an <strong>incoming Direct-PhD student (starting Fall 2027)</strong> at the School of Data Science, <strong>Fudan University</strong>, where I will be advised by <a href="http://www.fudan-disc.com/people/zywei" target="_blank">Prof. Zhongyu Wei (魏忠钰)</a> in the <a href="http://www.fudan-disc.com/" target="_blank">Data Intelligence and Social Computing Lab (Fudan DISC)</a>.
  </p>
  <p>
    During my undergraduate studies, I have been working as a research intern at the <strong>DUT Information Retrieval Lab (DUTIR)</strong> under the supervision of Assoc. Prof. Liang Yang and Prof. Hongfei Lin, and I have also collaborated with Prof. Yanming Shen on scientific LLM agents.
  </p>
  <p>
    My research centers on understanding, aligning, and empowering <strong>Large Language Models (LLMs)</strong> across social, legal, and scientific domains. Specifically, my core research interests include:
    <strong>LLMs &amp; Post-Training</strong> (persona modeling, preference &amp; value alignment, and human-AI collaboration),
    <strong>Mechanistic Interpretability &amp; AI Safety</strong> (latent representation probing, activation steering, and intrinsic moral alignment),
    <strong>LLM Agents &amp; Social/Judicial Computing</strong> (structured cognitive workflows, social simulation, and Legal AI), and
    <strong>AI for Science</strong> (evolutionary knowledge agents for protein and materials discovery).
  </p>
  <p>
    I always welcome academic discussions and potential collaborations—please feel free to reach out at <a href="mailto:huluoming2004@163.com">huluoming2004@163.com</a> or my institutional email <a href="mailto:huluoming2004@mail.dlut.edu.cn">huluoming2004@mail.dlut.edu.cn</a>.
  </p>

